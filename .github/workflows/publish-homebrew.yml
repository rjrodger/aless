name: publish-homebrew

# The Homebrew formula, pushed to rjrodger/homebrew-tap. release.yml
# (generated by dist from dist-workspace.toml) calls this in its publish
# phase, after the GitHub Release, and with it the tag, exists, in place of
# dist's own Homebrew job.
#
# WHY NOT DIST'S JOB. dist writes the formula, aless.rb, and its job
# commits it to the tap as it is. That formula installs the binary and
# puts every other file of the archive in $(brew --prefix)/share/aless,
# the man page and the shells' completions among them, where neither man
# nor a shell looks. scripts/homebrew-formula.py adds what a formula in
# homebrew-core has: the man page in man1, the completions in
# bash_completion, zsh_completion and fish_completion, and a test for
# `brew test`. Then `brew style --fix` tidies dist's own lines, as dist's
# job does, and the formula is committed to the tap. That formula passes
# `brew audit --strict` and `brew test`.
#
# THE TOKEN. HOMEBREW_TAP_TOKEN is a fine-grained token that can write the
# contents of rjrodger/homebrew-tap and nothing else (RELEASING.md).
#
# A failure here unpublishes nothing: fix the cause and re-run this job of
# the same run.

on:
  workflow_call:
    inputs:
      plan:
        description: dist's plan for this release, as JSON
        required: true
        type: string

permissions: {}

jobs:
  formula:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read  # the release commit, for scripts/homebrew-formula.py
    steps:
      - name: The release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: aless
          persist-credentials: false

      - name: The tap
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: rjrodger/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
          persist-credentials: true

      # dist's global artifacts: the installers, the formula, the SBOM.
      - name: The formula dist wrote
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifacts-build-global
          path: dist-artifacts

      - name: The man page, the completions and a test, added
        run: |
          set -euo pipefail
          mkdir -p tap/Formula
          python3 aless/scripts/homebrew-formula.py dist-artifacts/aless.rb > tap/Formula/aless.rb
          ruby -c tap/Formula/aless.rb

      # As dist's job: the runner's Homebrew, with the cops for the
      # description and the homepage, which come from Cargo.toml, left out.
      - name: Homebrew's style
        run: |
          export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
          brew update
          brew style --except-cops FormulaAudit/Homepage,FormulaAudit/Desc,FormulaAuditStrict --fix tap/Formula/aless.rb || true

      - name: Commit and push the formula
        working-directory: tap
        env:
          PLAN: ${{ inputs.plan }}
        run: |
          set -euo pipefail
          version=$(jq -r '.releases[] | select(.app_name == "aless") | .app_version' <<<"$PLAN")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/aless.rb
          if git diff --cached --quiet; then
            echo "the tap has this formula already"
            exit 0
          fi
          git commit -m "aless ${version}"
          git push
