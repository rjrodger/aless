name: publish-crates

# crates.io for aless. release.yml (generated by dist from
# dist-workspace.toml) calls this in its publish phase, after the GitHub
# Release, and with it the tag, exists. A failure here unpublishes
# nothing: fix the cause and re-run this job of the same run.
#
# TRUSTED PUBLISHING. GitHub mints an OIDC token, and crates.io exchanges
# it for a token that expires after 30 minutes; no secret is stored. In a
# called workflow the OIDC token's workflow_ref names the CALLER, so the
# trusted publisher on crates.io names release.yml, not this file, with
# the environment `release`.
#
# THE FIRST VERSION IS PUBLISHED BY HAND. crates.io accepts a trusted
# publisher only for a crate that exists, so the owner publishes the first
# version with a short-lived token scoped to aless (RELEASING.md). This
# job then finds that version on crates.io and skips; before it does, it
# fails closed with that instruction rather than publish nothing quietly.
#
# PUBLISHED FROM THE RELEASE COMMIT, the one release.yml was dispatched
# on and tagged, and only when Cargo.toml's version is the tag's.

on:
  workflow_call:
    inputs:
      plan:
        description: dist's plan for this release, as JSON
        required: true
        type: string

permissions: {}

jobs:
  crates:
    runs-on: ubuntu-latest
    environment: release
    # The exchanged token lives 30 minutes.
    timeout-minutes: 30
    permissions:
      contents: read  # the release commit
      id-token: write # OIDC -> crates.io, the only credential this job holds
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # rustup rather than a third-party toolchain action, as in ci.yml.
      - name: Set up Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: The version this release publishes
        id: version
        env:
          PLAN: ${{ inputs.plan }}
        run: |
          set -euo pipefail
          V=$(cargo metadata --no-deps --format-version 1 --locked \
                | jq -r '.packages[] | select(.name == "aless") | .version')
          TAG=$(jq -r '.announcement_tag' <<<"$PLAN")
          if [ "$TAG" != "v$V" ]; then
            echo "::error::the release tag is $TAG, but Cargo.toml's version is $V"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # crates.io versions are immutable: one already there is not
      # published again, and the job succeeds.
      - name: Is this version on crates.io already?
        id: exists
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ua="aless release (https://github.com/rjrodger/aless)"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -A "$ua" "https://crates.io/api/v1/crates/aless/$V")
          case "$code" in
            200)
              echo "aless $V is on crates.io already: nothing to publish"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            404)
              crate=$(curl -sS -o /dev/null -w '%{http_code}' -A "$ua" "https://crates.io/api/v1/crates/aless")
              if [ "$crate" = 404 ]; then
                echo "::error::aless is not on crates.io yet. Its first version is published by hand, with a token, and only then can its trusted publisher be configured: see RELEASING.md"
                exit 1
              fi
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::crates.io answered $code for aless $V"
              exit 1
              ;;
          esac

      - name: Exchange the OIDC token for a crates.io token
        if: steps.exists.outputs.publish == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        if: steps.exists.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
