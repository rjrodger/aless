name: pages

# Publishes the documentation site, https://aless.tabnas.dev, from main.
#
# The pages are Markdown under site/, and tests/site.rs builds them, with
# the reference written from the aless binary built from the same commit.
# It checks them as it builds (links, the options each example names, each
# console example's output, the house style) and writes the site into
# ALESS_SITE_OUT; ci.yml runs the same checks on every pull request.
#
# The owner verifies the domain for their account, then sets two things
# once, in Settings → Pages: the source, "GitHub Actions", and the custom
# domain. With that source GitHub reads the domain from the setting and
# ignores a CNAME file; site/CNAME is published all the same, and
# tests/site.rs holds it to Cargo.toml's homepage. Until Pages is enabled,
# the site is built and checked and the deploy is skipped with a notice,
# rather than failing main. RELEASING.md has the steps, the DNS records
# included.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never cancel one midway: a half-published
# site is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build and check the site
        run: ALESS_SITE_OUT="$RUNNER_TEMP/site" cargo test --locked --test site -- --nocapture

      # A 404 is Pages not enabled yet; any other failure is a failure.
      - name: Is Pages enabled, with GitHub Actions as its source?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>"$RUNNER_TEMP/pages.err"); then
            if [ "$build_type" = workflow ]; then
              echo "enabled=true" >> "$GITHUB_OUTPUT"
            else
              echo "::notice title=Pages::Pages builds from a branch, not from GitHub Actions; the site was built and checked, not deployed. Set Settings → Pages → Source to GitHub Actions (RELEASING.md)."
              echo "enabled=false" >> "$GITHUB_OUTPUT"
            fi
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/pages.err"; then
            echo "::notice title=Pages::Pages is not enabled; the site was built and checked, not deployed. Set Settings → Pages → Source to GitHub Actions (RELEASING.md)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/pages.err" >&2
            exit 1
          fi

      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
