name: ci

# aless must work on Linux, macOS and Windows, so every push and pull
# request builds and tests on all three. The tabnas crates come from
# crates.io (see Cargo.toml), pinned by Cargo.lock; `--locked` keeps the
# pins honest.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # rustup rather than a third-party toolchain action: the runners
      # ship it, and it leaves one less action to pin.
      - name: Set up Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # tests/translate_matrix.rs and tests/yaml_render.rs read the grammar
      # repositories' own fixtures, which the published crates do not
      # ship: checkouts at the tags of the locked versions, cloned here
      # and named in TABNAS_FIXTURES_DIR and TABNAS_YAML_DIR for the steps
      # after this one.
      - name: The grammar repositories' fixtures
        shell: bash
        run: scripts/fixtures.sh

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      # Every document of every format's own fixture corpus written into
      # every format --render writes, and read back under the target's
      # declared conventions: thousands of documents, in the optimised
      # matrix profile, on one platform. --nocapture shows the line the
      # test prints every 25 documents, so the step is never silent.
      - name: Translation matrix (every format's fixtures)
        if: runner.os == 'Linux'
        run: cargo test --locked --profile matrix --test translate_matrix -- --ignored --nocapture

      - name: Terminal smoke test (pty)
        if: runner.os != 'Windows'
        run: python3 scripts/pty-smoke.py target/debug/aless

      # The published crate carries only what Cargo.toml's include list
      # names, and packaging it builds it from exactly those files.
      - name: Crate packages and builds
        if: runner.os == 'Linux'
        run: cargo package --locked

      - name: Release build
        run: cargo build --release --locked

      - name: Binary starts, and answers without a screen
        shell: bash
        run: |
          ./target/release/aless --version
          ./target/release/aless --help | head -3
          out=$(echo '{"a": [1, 2]}' | ./target/release/aless --json --compact)
          test "$out" = '{"a":[1,2]}'
          ./target/release/aless --where --at 7:9 tests/fixtures/nested.json | grep -q '"path": ".store.books\[1\].title"'
          status=0; ./target/release/aless tests/fixtures/bad.json 2>/dev/null || status=$?
          test "$status" = 1

  msrv:
    name: rust 1.88 (minimum supported)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # `default` makes the MSRV the toolchain cargo runs under.
      - name: Set up Rust 1.88
        run: |
          rustup toolchain install 1.88 --profile minimal
          rustup default 1.88
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --locked --all-targets
