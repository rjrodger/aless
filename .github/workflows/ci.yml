name: ci

# aless must work on Linux, macOS and Windows, so every push and pull
# request builds and tests on all three. The tabnas crates come from
# crates.io (see Cargo.toml), pinned by Cargo.lock; `--locked` keeps the
# pins honest.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # rustup rather than a third-party toolchain action: the runners
      # ship it, and it leaves one less action to pin.
      - name: Set up Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      - name: Terminal smoke test (pty)
        if: runner.os != 'Windows'
        run: python3 admin/scripts/pty-smoke.py target/debug/aless

      # The published crate carries only what Cargo.toml's include list
      # names, and packaging it builds it from exactly those files.
      - name: Crate packages and builds
        if: runner.os == 'Linux'
        run: cargo package --locked

      - name: Release build
        run: cargo build --release --locked

      # A viewer: it answers -h, --help and --version anywhere, and without a
      # terminal to draw on it refuses to start, with one line on standard
      # error, nothing on standard output and the status 2.
      - name: Binary starts, and refuses without a terminal
        shell: bash
        run: |
          ./target/release/aless --version
          ./target/release/aless --help | head -3
          status=0; ./target/release/aless tests/fixtures/nested.json </dev/null >out.txt 2>err.txt || status=$?
          test "$status" = 2
          test ! -s out.txt
          grep -q 'needs a terminal' err.txt

  # The comment gate, the prose gate, Vale and Vale's recorded counts
  # (DEV-PROCESS.md, STYLE-GUIDE.md). Node is on the runner; Vale is
  # fetched at the version pinned here, and its Google package at the URL
  # .vale.ini pins, so a release of either cannot turn a run red.
  gates:
    name: comments and prose
    runs-on: ubuntu-latest
    env:
      VALE_VERSION: 3.24.0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install Vale
        run: |
          curl -fsSL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" vale
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: vale sync
      - name: Comment gate
        run: node admin/scripts/comment-gate.cjs
      - name: Prose gate
        run: node admin/scripts/prose-gate.cjs
      - name: Vale
        run: vale --minAlertLevel=error $(node admin/scripts/prose-gate.cjs --list)
      - name: Vale's recorded counts
        run: node admin/scripts/vale-counts.cjs

  msrv:
    name: rust 1.88 (minimum supported)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # `default` makes the MSRV the toolchain cargo runs under.
      - name: Set up Rust 1.88
        run: |
          rustup toolchain install 1.88 --profile minimal
          rustup default 1.88
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --locked --all-targets
