# The prose gate (STYLE-GUIDE.md, "How this guide is enforced"). Vale
# runs over the gated set, the page list that
# `node admin/scripts/prose-gate.cjs --list` prints, at the levels set
# here.
#
# Precedence, recorded in the style guide:
#
#   house voice  ->  Google  ->  Vale defaults
#
# Google (developers.google.com/style) is the base for everything the
# house guide is silent on. Where the two collide the house voice wins,
# and every such override is listed below with its reason, so a reader
# who wonders why a Google rule is off finds the answer here rather than
# guessing it is an oversight.
#
# A rule demoted on evidence records what it produced on a clean run
# over the gated set, as a count of hits, and this header may record the
# run's total, as a count of alerts across a count of files.
# `node admin/scripts/vale-counts.cjs` checks every such count against a
# live run, and `--write` re-measures them: a count is written as zero
# the first time, and the script measures it. A number nothing
# re-measures goes stale the first time a page is edited.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = House
# PINNED BY URL, not by name. `Packages = Google` resolves to whatever
# the package registry serves at sync time, so a Google release could
# add or change an error-level rule and turn an unrelated pull request
# red: the nondeterminism that pinning the Vale binary prevents. Pinning
# one without the other prevents half of it.
Packages = https://github.com/errata-ai/Google/releases/download/v0.7.1/Google.zip

[*.md]
BasedOnStyles = Vale, Google, House

# --- Scope ------------------------------------------------------------
#
# Vale is handed an EXPLICIT FILE LIST, printed by
# `node admin/scripts/prose-gate.cjs --list` and read by that gate too,
# so the two gates cannot disagree about which pages they cover.
#
# It is not done with `[section]` headers here, and that is not a style
# preference: Vale selects sections by file EXTENSION, so a header like
# `[sketch/**]` matches nothing and the working documents get linted
# anyway, in silence. Nor with `--glob`, which takes one pattern.

# --- Overrides where the house voice wins ------------------------------
#
# The register is Richard Rodger's blog voice, not neutral vendor docs.
# These rules encode Google's house style rather than correctness, and
# each would flatten a voice choice the guide makes on purpose.

# "We" is allowed in TUTORIALS ONLY, where the page walks through code
# with the reader (STYLE-GUIDE.md, voice rule 7). Vale cannot express
# "only in tutorials", so the rule is off here and the restriction is
# carried by the prose gate's `first-person-plural` rule, which knows
# which page is a tutorial.
Google.We = NO

# "I" appears nowhere in the docs by house rule, which is STRICTER than
# Google's. The prose gate's `first-person-singular` rule covers it,
# including `my` and `mine`, and does not fire on the `I` inside quoted
# command output the way this rule does.
#
# Switching a Google rule off in favour of a house rule means the house
# rule has to be real: the named rule is the receipt.
Google.FirstPerson = NO

# British spellings (-ise, -isation, colour). Google style is US
# English; the house voice is not, and the precedence above puts the
# house voice first. Actual misspellings are caught by Vale.Spelling,
# which stays at error.
Google.Spelling = NO

# The house voice alternates long explanatory sentences with short
# verdicts, and the occasional passive is how a sentence keeps its
# subject on the thing being documented ("the file is overwritten").
# Advisory only, never a gate.
Google.Passive = suggestion

# Contractions are a register choice per document kind, not a rule:
# tutorials contract, reference pages do not. Advisory only.
Google.Contractions = suggestion

# Voice rule 4 rations parentheses more precisely than "use parentheses
# judiciously" can: definitions, caveats, and at most one dry aside per
# page, with reference pages carrying facts only.
Google.Parens = suggestion

# A semicolon joining two independent clauses is part of the long
# explanatory sentence in voice rule 6. Advisory.
Google.Semicolons = suggestion

# US convention: commas and periods INSIDE the quotation marks. The
# house voice is not US English (the same call as the -ise spellings),
# and putting a period inside a quoted `code span` is actively wrong
# when the quote is a literal.
Google.Quotes = warning

# The guide allows one exclamation mark per page, in tutorials only, on a
# genuine payoff; Google bans them outright. The ration is carried by the
# prose gate's `exclamation` rule, which knows which page is a tutorial.
Google.Exclamation = warning

# The house guide bans em dashes. The prose gate's `em-dash` rule checks
# prose after stripping code and quoted output; Google's spacing rule is
# redundant under the ban.
Google.EmDash = NO

# Serial commas, which the guide requires. The rule cannot tell a
# two-item list sitting after a comma clause ("each with the line and
# column it came from") from a list, so it is a warning an author reads,
# not a gate: an author reading its output can tell the two apart in the
# page in front of them.
Google.OxfordComma = warning

# --- The gate ----------------------------------------------------------
#
# Error level, and these fail CI. They are conventions a reader benefits
# from and an author has no reason to vary.

Google.Latin = error
Google.Ellipses = error
House.WordChoice = error

# Vale's dictionary, plus the terms accepted by name in
# .vale/styles/config/vocabularies/House/accept.txt. A word in neither is
# a typo until somebody adds it, which is the point of keeping this at
# error.
Vale.Spelling = error

# The banned list, read from reject.txt in the same vocabulary
# directory. admin/scripts/prose-gate.cjs reads that identical file, so
# the two gates cannot disagree about what is banned.
Vale.Avoid = error

# --- Demoted on evidence, not on taste --------------------------------
#
# A Google rule that is wrong for this project's pages is demoted here,
# after it was tried at error level against the real pages first, with
# what it produced on a clean run and why it was wrong. "It was noisy"
# is not a reason; "it reported a count of serial commas, every one a
# two-item list after a comma clause" is. A rule demoted without that
# note reads later as an oversight, and gets re-promoted by somebody
# repeating the work.
