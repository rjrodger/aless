[package]
name = "aless"
version = "0.5.0"
edition = "2021"
rust-version = "1.88"
authors = ["Richard Rodger <http://richardrodger.com>"]
description = "Terminal viewer and JSON CLI for JSON, YAML, TOML, CSV, XML and more"
license = "MIT"
repository = "https://github.com/rjrodger/aless"
homepage = "https://aless.tabnas.dev"
readme = "README.md"
keywords = ["json", "yaml", "toml", "viewer", "tui"]
categories = ["command-line-utilities"]
# What the published crate carries: the sources, the licence files, and
# every file the README links to (the docs, the agent skill, the man page
# and the completions, the example grammars). The tests stay in the
# repository.
include = [
    "/src",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
    "/README.md",
    "/CHANGELOG.md",
    "/PACKAGING.md",
    "/RELEASING.md",
    "/skills",
    "/man",
    "/completions",
    "/tests/fixtures/grammars",
]

[features]
default = ["clipboard"]
# System clipboard for the `y` commands. Without it, yank still copies
# through the terminal (OSC 52) and prints to the status line.
clipboard = ["dep:arboard"]

[dependencies]
crossterm = "0.29"
# The drawing layer: widgets over a buffer, diffed onto the terminal
# through crossterm (the same 0.29 the event loop uses).
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
notify = "8"
regex = "1.13"
unicode-width = "0.2"
serde_json = { version = "1.0", features = ["preserve_order"] }
arboard = { version = "3.6", optional = true, default-features = false, features = ["wayland-data-control"] }

# The tabnas engine and grammars, from crates.io. The engine's package is
# tabnas-parser; its library keeps the name `tabnas`.
tabnas = { package = "tabnas-parser", version = "0.12.15" }
tabnas-json = "0.5.19"
tabnas-jsonl = "0.1.19"
tabnas-jsonic = "0.7.10"
tabnas-jsonc = "0.5.16"
tabnas-json5 = "0.5.17"
tabnas-yaml = "0.5.26"
tabnas-toml = "0.5.18"
tabnas-ini = "0.5.20"
tabnas-csv = "0.6.9"
tabnas-xml = "0.7.19"
tabnas-zon = "0.5.18"
tabnas-markdown = "0.7.13"
tabnas-feed = "0.6.18"
tabnas-expr = "0.5.19"
tabnas-semver = "0.0.11"
tabnas-proto = "0.6.11"
tabnas-css = "0.5.16"
tabnas-chess = "0.1.17"
tabnas-c = "0.5.15"
# The grammar notations, each read as the grammar spec its compiler writes
# (the schema grammar-spec the three share). The ABNF compiler is also
# behind --grammar and --grammar-expr: a custom grammar's text becomes a
# GrammarSpec at startup. Each emits through tabnas-bnf, the compiler the
# BNF-family front-ends share.
tabnas-abnf = "0.4.25"
tabnas-ebnf = "0.1.19"
tabnas-gbnf = "0.1.20"
# Colour for the source view: the semantic tokens tabnas-lsp's language
# server sends an editor, taken from the same lex a grammar makes. No
# feature is on: aless supplies the parsers, and needs neither the
# bundled grammars (`fleet`) nor the grammar-text loaders (`dialects`).
tabnas-lsp = "0.1.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The engine checks its rule stack against a shadow copy on every step
# when debug assertions are on: an O(depth) check per step, which a deep
# rule stack pays on every one of them (while tabnas-bnf spelled a
# repetition as a rule calling itself per item, a custom grammar's rule
# stack grew with the input, and 800 hosts lines took 31 s in a debug
# build against 0.4 s without the check). The check is the engine's own
# self-test, not aless's, so the dev profile (and `cargo test`, which
# inherits it) turns it off for that package alone; nothing else about
# the build changes.
[profile.dev.package.tabnas-parser]
debug-assertions = false

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
strip = true

# The profile dist builds the released binaries with (dist-workspace.toml):
# the release profile above, unchanged.
[profile.dist]
inherits = "release"
