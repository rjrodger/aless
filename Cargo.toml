[package]
name = "aless"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["Richard Rodger <http://richardrodger.com>"]
description = "A jless-style terminal viewer for every format the tabnas parsers read, with tabs and watch-and-reload that keeps your place."
license = "MIT"
repository = "https://github.com/rjrodger/aless"
readme = "README.md"
keywords = ["json", "yaml", "toml", "viewer", "tui"]
categories = ["command-line-utilities"]

[features]
default = ["clipboard"]
# System clipboard for the `y` commands. Without it, yank still copies
# through the terminal (OSC 52) and prints to the status line.
clipboard = ["dep:arboard"]

[dependencies]
crossterm = "0.29"
# The drawing layer: widgets over a buffer, diffed onto the terminal
# through crossterm (the same 0.29 the event loop uses).
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
notify = "8"
regex = "1.13"
unicode-width = "0.2"
serde_json = { version = "1.0", features = ["preserve_order"] }
arboard = { version = "3.6", optional = true, default-features = false, features = ["wayland-data-control"] }

# The tabnas engine and grammars are taken straight from GitHub, pinned by
# Cargo.lock to a commit each. All of them but tabnas-lsp are on crates.io
# now; once tabnas-lsp is too, these become plain version requirements and
# the [patch] tables below go away. The engine's package is tabnas-parser
# (its library keeps the name `tabnas`), so the tables below name that
# package.
tabnas = { package = "tabnas-parser", git = "https://github.com/tabnas/parser" }
tabnas-json = { git = "https://github.com/tabnas/json" }
tabnas-jsonl = { git = "https://github.com/tabnas/jsonl" }
tabnas-jsonic = { git = "https://github.com/tabnas/jsonic" }
tabnas-jsonc = { git = "https://github.com/tabnas/jsonc" }
tabnas-json5 = { git = "https://github.com/tabnas/json5" }
tabnas-yaml = { git = "https://github.com/tabnas/yaml" }
tabnas-toml = { git = "https://github.com/tabnas/toml" }
tabnas-ini = { git = "https://github.com/tabnas/ini" }
tabnas-csv = { git = "https://github.com/tabnas/csv" }
tabnas-xml = { git = "https://github.com/tabnas/xml" }
tabnas-zon = { git = "https://github.com/tabnas/zon" }
tabnas-markdown = { git = "https://github.com/tabnas/markdown" }
tabnas-feed = { git = "https://github.com/tabnas/feed" }
# The ABNF compiler behind --grammar and --grammar-expr: a custom grammar's
# text becomes a GrammarSpec at startup. It emits through tabnas-bnf, the
# compiler the BNF-family front-ends share.
tabnas-abnf = { git = "https://github.com/tabnas/abnf" }
# The streaming transducer and its renderers, behind `--render`.
tabnas-transduce = { git = "https://github.com/tabnas/transduce" }
tabnas-render = { git = "https://github.com/tabnas/render" }
# The alchemy language, behind `--alchemy`: a program compiled onto the
# transducer and the renderers, run over any document the grammars read.
tabnas-alchemy = { git = "https://github.com/tabnas/alchemy" }
# Colour for a pane's text: the semantic tokens tabnas-lsp's language
# server sends an editor, taken from the same lex a grammar makes. No
# feature is on: aless supplies the parsers, and needs neither the
# bundled grammars (`fleet`) nor the grammar-text loaders (`dialects`).
tabnas-lsp = { git = "https://github.com/tabnas/lsp" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Each grammar crate names its siblings by relative path
# (`tabnas = { package = "tabnas-parser", path = "../../parser/rs" }`), the
# tabnas sibling-checkout development model. Inside a git checkout cargo
# reads such a dependency as
# "the package of that name in this same git source", which does not
# exist, so these tables supply each sibling from its own repository. One
# table per grammar repository, listing the siblings its manifest names.
[patch."https://github.com/tabnas/json"]
tabnas-parser = { git = "https://github.com/tabnas/parser" }

[patch."https://github.com/tabnas/jsonl"]
tabnas-parser = { git = "https://github.com/tabnas/parser" }
tabnas-json = { git = "https://github.com/tabnas/json" }

[patch."https://github.com/tabnas/jsonic"]
tabnas-parser = { git = "https://github.com/tabnas/parser" }
tabnas-json = { git = "https://github.com/tabnas/json" }

[patch."https://github.com/tabnas/jsonc"]
tabnas-parser = { git = "https://github.com/tabnas/parser" }
tabnas-jsonic = { git = "https://github.com/tabnas/jsonic" }

[patch."https://github.com/tabnas/json5"]
tabnas-parser = { git = "https://github.com/tabnas/parser" }
tabnas-jsonic = { git = "https://github.com/tabnas/jsonic" }

[patch."https://github.com/tabnas/yaml"]
tabnas-parser = { git = "https://github.com/tabnas/parser" }
tabnas-jsonic = { git = "https://github.com/tabnas/jsonic" }

[patch."https://github.com/tabnas/toml"]
tabnas-parser = { git = "https://github.com/tabnas/parser" }
tabnas-jsonic = { git = "https://github.com/tabnas/jsonic" }

[patch."https://github.com/tabnas/ini"]
tabnas-parser = { git = "https://github.com/tabnas/parser" }
tabnas-jsonic = { git = "https://github.com/tabnas/jsonic" }
tabnas-hoover = { git = "https://github.com/tabnas/hoover" }

[patch."https://github.com/tabnas/hoover"]
tabnas-parser = { git = "https://github.com/tabnas/parser" }

[patch."https://github.com/tabnas/csv"]
tabnas-parser = { git = "https://github.com/tabnas/parser" }
tabnas-jsonic = { git = "https://github.com/tabnas/jsonic" }

[patch."https://github.com/tabnas/xml"]
tabnas-parser = { git = "https://github.com/tabnas/parser" }
tabnas-jsonic = { git = "https://github.com/tabnas/jsonic" }

[patch."https://github.com/tabnas/zon"]
tabnas-parser = { git = "https://github.com/tabnas/parser" }
tabnas-jsonic = { git = "https://github.com/tabnas/jsonic" }

[patch."https://github.com/tabnas/markdown"]
tabnas-parser = { git = "https://github.com/tabnas/parser" }

[patch."https://github.com/tabnas/feed"]
tabnas-parser = { git = "https://github.com/tabnas/parser" }
tabnas-jsonic = { git = "https://github.com/tabnas/jsonic" }
tabnas-xml = { git = "https://github.com/tabnas/xml" }

[patch."https://github.com/tabnas/abnf"]
tabnas-parser = { git = "https://github.com/tabnas/parser" }
tabnas-bnf = { git = "https://github.com/tabnas/bnf" }

[patch."https://github.com/tabnas/bnf"]
tabnas-parser = { git = "https://github.com/tabnas/parser" }

[patch."https://github.com/tabnas/transduce"]
tabnas-parser = { git = "https://github.com/tabnas/parser" }
tabnas-json = { git = "https://github.com/tabnas/json" }
tabnas-csv = { git = "https://github.com/tabnas/csv" }

[patch."https://github.com/tabnas/render"]
tabnas-parser = { git = "https://github.com/tabnas/parser" }
tabnas-transduce = { git = "https://github.com/tabnas/transduce" }

[patch."https://github.com/tabnas/alchemy"]
tabnas-parser = { git = "https://github.com/tabnas/parser" }
tabnas-transduce = { git = "https://github.com/tabnas/transduce" }
tabnas-render = { git = "https://github.com/tabnas/render" }
tabnas-json = { git = "https://github.com/tabnas/json" }

# lsp's optional siblings are resolved only for the features a consumer
# turns on, and aless turns on none: the engine is the one to supply.
[patch."https://github.com/tabnas/lsp"]
tabnas-parser = { git = "https://github.com/tabnas/parser" }

# The engine checks its rule stack against a shadow copy on every step
# when debug assertions are on: an O(depth) check per step, which a deep
# rule stack pays on every one of them (while tabnas-bnf spelled a
# repetition as a rule calling itself per item, a custom grammar's rule
# stack grew with the input, and 800 hosts lines took 31 s in a debug
# build against 0.4 s without the check). The check is the engine's own
# self-test, not aless's, so the dev profile (and `cargo test`, which
# inherits it) turns it off for that package alone; nothing else about
# the build changes.
[profile.dev.package.tabnas-parser]
debug-assertions = false

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
strip = true
