[package]
name = "aless"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
authors = ["Richard Rodger <http://richardrodger.com>"]
description = "Terminal viewer and JSON CLI for JSON, YAML, TOML, CSV, XML and more"
license = "MIT"
repository = "https://github.com/rjrodger/aless"
homepage = "https://aless.tabnas.dev"
readme = "README.md"
keywords = ["json", "yaml", "toml", "viewer", "tui"]
categories = ["command-line-utilities"]
# What the published crate carries: the sources, the licence files, and
# every file the README links to (the docs, the agent skill, the man page
# and the completions, the example grammars and programs). The tests stay
# in the repository: two of them read checkouts of the grammar
# repositories (TABNAS_FIXTURES_DIR, TABNAS_YAML_DIR), which a crate cannot
# ship.
include = [
    "/src",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
    "/README.md",
    "/CHANGELOG.md",
    "/PACKAGING.md",
    "/RELEASING.md",
    "/skills",
    "/man",
    "/completions",
    "/tests/fixtures/grammars",
    "/tests/fixtures/programs",
]

[features]
default = ["clipboard"]
# System clipboard for the `y` commands. Without it, yank still copies
# through the terminal (OSC 52) and prints to the status line.
clipboard = ["dep:arboard"]

[dependencies]
crossterm = "0.29"
# The drawing layer: widgets over a buffer, diffed onto the terminal
# through crossterm (the same 0.29 the event loop uses).
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
notify = "8"
regex = "1.13"
unicode-width = "0.2"
serde_json = { version = "1.0", features = ["preserve_order"] }
arboard = { version = "3.6", optional = true, default-features = false, features = ["wayland-data-control"] }

# The tabnas engine and grammars, from crates.io. The engine's package is
# tabnas-parser; its library keeps the name `tabnas`. tests/translate_matrix.rs
# and tests/yaml_render.rs read the grammar repositories' own fixtures,
# which the published crates do not ship, from checkouts at the locked
# versions' tags: TABNAS_FIXTURES_DIR and TABNAS_YAML_DIR name them, and
# scripts/fixtures.sh clones them.
tabnas = { package = "tabnas-parser", version = "0.12.11" }
tabnas-json = "0.5.17"
tabnas-jsonl = "0.1.16"
tabnas-jsonic = "0.7.9"
tabnas-jsonc = "0.5.14"
tabnas-json5 = "0.5.15"
tabnas-yaml = "0.5.23"
tabnas-toml = "0.5.16"
tabnas-ini = "0.5.18"
tabnas-csv = "0.6.6"
tabnas-xml = "0.7.16"
tabnas-zon = "0.5.16"
tabnas-markdown = "0.7.12"
tabnas-feed = "0.6.15"
# The ABNF compiler behind --grammar and --grammar-expr: a custom grammar's
# text becomes a GrammarSpec at startup. It emits through tabnas-bnf, the
# compiler the BNF-family front-ends share.
tabnas-abnf = "0.4.20"
# The streaming transducer and its renderers, behind `--render`.
tabnas-transduce = "0.2.6"
tabnas-render = "0.2.4"
# The alchemy language, behind `--alchemy`: a program compiled onto the
# transducer's routers and the renderers, which aless passes in, and run
# over any document the grammars read. The two crates above take their
# shared types from it; it depends on neither.
tabnas-alchemy = "0.2.5"
# Colour for a pane's text: the semantic tokens tabnas-lsp's language
# server sends an editor, taken from the same lex a grammar makes. No
# feature is on: aless supplies the parsers, and needs neither the
# bundled grammars (`fleet`) nor the grammar-text loaders (`dialects`).
tabnas-lsp = "0.1.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The engine checks its rule stack against a shadow copy on every step
# when debug assertions are on: an O(depth) check per step, which a deep
# rule stack pays on every one of them (while tabnas-bnf spelled a
# repetition as a rule calling itself per item, a custom grammar's rule
# stack grew with the input, and 800 hosts lines took 31 s in a debug
# build against 0.4 s without the check). The check is the engine's own
# self-test, not aless's, so the dev profile (and `cargo test`, which
# inherits it) turns it off for that package alone; nothing else about
# the build changes.
[profile.dev.package.tabnas-parser]
debug-assertions = false

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
strip = true

# The profile dist builds the released binaries with (dist-workspace.toml):
# the release profile above, unchanged.
[profile.dist]
inherits = "release"

# The translation matrix over every format's fixtures
# (tests/translate_matrix.rs, run with --ignored): optimised as the release
# build is, without the link-time work a test binary does not repay.
[profile.matrix]
inherits = "release"
lto = false
codegen-units = 16
strip = false
